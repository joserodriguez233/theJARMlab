# site properties and page defaults
title: JARMlab
subtitle: Rodríguez-Martínez lab at the University of Puerto Rico Río Piedras
description: We study how transcription factors read the genome and how non-coding genetic variants disrupt that reading to cause cardiovascular disease. Using biochemistry, high-throughput sequencing, and machine learning, we decode the regulatory logic of the cardiac genome.
